name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # 本项目只支持 Windows（DSH 桌面版 + PowerShell 启动器 + Windows 路径语义），
    # 测试夹具里也使用 C:\ 与 D:\ 形式的路径，因此只在 Windows 上跑。
    name: Test (Windows, Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: npm test

  syntax:
    name: Syntax check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: JavaScript syntax
        shell: bash
        run: |
          for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f"; done

      - name: Python syntax
        shell: bash
        run: |
          for f in $(git ls-files '*.py'); do python -m py_compile "$f"; done