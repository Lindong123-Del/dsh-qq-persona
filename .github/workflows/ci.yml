name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: npm test

  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: JavaScript syntax
        run: |
          for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f"; done

      - name: Python syntax
        run: |
          for f in $(git ls-files '*.py'); do python -m py_compile "$f"; done